<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="A digit being checked against its row, column, and box.">
  <rect width="640" height="360" fill="#f7f4ef"/>
  <g transform="translate(28,28)">
    <rect width="304" height="304" fill="#fffdf8"/>
    <rect x="0" y="128" width="304" height="32" fill="#d9ebe4"/>
    <rect x="160" y="0" width="32" height="304" fill="#d9e3ea"/>
    <rect x="96" y="96" width="96" height="96" fill="#e7f2fb"/>
    <g stroke="#c9c0b2" stroke-width="1">
      <path d="M32 0 V304 M64 0 V304 M128 0 V304 M192 0 V304 M224 0 V304 M256 0 V304 M288 0 V304"/>
      <path d="M0 32 H304 M0 64 H304 M0 128 H304 M0 192 H304 M0 224 H304 M0 256 H304 M0 288 H304"/>
    </g>
    <g stroke="#1f4d63" stroke-width="3" fill="none">
      <rect width="304" height="304"/>
      <path d="M96 0 V304 M192 0 V304 M0 96 H304 M0 192 H304"/>
    </g>
    <circle cx="176" cy="144" r="12" fill="#0c4f86"/>
    <text x="176" y="149" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#f7f6f3">5</text>
  </g>
  <g font-family="sans-serif" fill="#1f4d63">
    <text x="360" y="90" font-size="22" font-weight="700">Check all three</text>
    <text x="360" y="140" font-size="18">The 5 is only legal if the</text>
    <text x="360" y="168" font-size="18">row, the column, and the</text>
    <text x="360" y="196" font-size="18">box do not already hold a 5.</text>
    <text x="360" y="246" font-size="18">Missing one of those checks</text>
    <text x="360" y="274" font-size="18">is how a later cell runs out</text>
    <text x="360" y="302" font-size="18">of digits.</text>
  </g>
</svg>
