<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="A 9 by 9 grid with one row, one column, and one box marked.">
  <rect width="640" height="360" fill="#f7f4ef"/>
  <g transform="translate(28,28)">
    <rect width="304" height="304" fill="#fffdf8"/>
    <g>
      <rect x="0" y="96" width="304" height="32" fill="#d9ebe4"/>
      <rect x="128" y="0" width="32" height="304" fill="#d9e3ea"/>
      <rect x="192" y="192" width="96" height="96" fill="#f8e2c8"/>
    </g>
    <g stroke="#c9c0b2" stroke-width="1">
      <path d="M32 0 V304 M64 0 V304 M128 0 V304 M160 0 V304 M224 0 V304 M256 0 V304 M288 0 V304"/>
      <path d="M0 32 H304 M0 64 H304 M0 128 H304 M0 160 H304 M0 224 H304 M0 256 H304 M0 288 H304"/>
    </g>
    <g stroke="#1f4d63" stroke-width="3" fill="none">
      <rect width="304" height="304"/>
      <path d="M96 0 V304 M192 0 V304 M0 96 H304 M0 192 H304"/>
    </g>
  </g>
  <g font-family="sans-serif" fill="#1f4d63">
    <text x="360" y="80" font-size="22" font-weight="700">Three places to look</text>
    <text x="360" y="130" font-size="18">Green: one row, digits 1–9 once.</text>
    <text x="360" y="164" font-size="18">Blue: one column, the same rule.</text>
    <text x="360" y="198" font-size="18">Orange: one 3×3 box, the same rule.</text>
    <text x="360" y="250" font-size="18">A digit may sit in a cell only</text>
    <text x="360" y="276" font-size="18">when all three still have room.</text>
  </g>
</svg>
