<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="A cell with candidate notes 2, 5, and 8.">
  <rect width="640" height="360" fill="#f7f4ef"/>
  <rect x="40" y="40" width="240" height="240" rx="12" fill="#fffdf8" stroke="#1f4d63" stroke-width="4"/>
  <g font-family="sans-serif" font-size="28" fill="#1f4d63" text-anchor="middle">
    <text x="80" y="90">2</text>
    <text x="160" y="90" fill="#c9c0b2">3</text>
    <text x="240" y="90" fill="#c9c0b2">4</text>
    <text x="80" y="170">5</text>
    <text x="160" y="170" fill="#c9c0b2">6</text>
    <text x="240" y="170" fill="#c9c0b2">7</text>
    <text x="80" y="250">8</text>
    <text x="160" y="250" fill="#c9c0b2">9</text>
    <text x="240" y="250" fill="#c9c0b2">1</text>
  </g>
  <g font-family="sans-serif" fill="#1f4d63">
    <text x="320" y="90" font-size="22" font-weight="700">Notes, not a guess</text>
    <text x="320" y="140" font-size="18">2, 5, and 8 are still possible.</text>
    <text x="320" y="174" font-size="18">The faded digits are already</text>
    <text x="320" y="208" font-size="18">in the row, column, or box.</text>
    <text x="320" y="258" font-size="18">Auto-candidates on the game</text>
    <text x="320" y="292" font-size="18">page writes these for you.</text>
  </g>
</svg>
