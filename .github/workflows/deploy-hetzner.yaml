name: Deploy Sudoku to Hetzner
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        run: |
          echo "${{ secrets.HETZNER_SSH_KEY }}" > key
          chmod 600 key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy via SSH
        run: |
          ssh -i key -o IdentitiesOnly=yes deploy@${{ secrets.HETZNER_HOST }} "cd /var/www/sudokusudoku.com/wp-content/themes/sudoku && git fetch --prune origin && git reset --hard origin/main"
      - name: Clean Up
        if: always()
        run: |
          rm -f key
